<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet Interpreter Setup</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body class="setup">
    <div class="wrap" style="max-width: 720px; margin: 0 auto">
      <header class="app-header">
        <h1>Meet Interpreter 初期設定</h1>
        <p>マイク許可・3デバイス・接続コード・Broker URLを設定します。</p>
      </header>

      <section class="panel">
        <h2 style="margin: 0; font-size: 15px">1. 権限</h2>
        <p class="hint">
          初回は通常の拡張タブでマイク許可を取得します。一時トラックは直ちに停止します。
        </p>
        <button id="btn-permission" class="primary">マイク権限を許可</button>
        <button id="btn-refresh-devices">デバイス一覧を更新</button>
      </section>

      <section class="panel">
        <h2 style="margin: 0; font-size: 15px">2. 音声デバイス</h2>
        <label class="field">
          <span>物理マイク（BlackHole入力は選択禁止）</span>
          <select id="physical-mic"></select>
        </label>
        <label class="field">
          <span>イヤホン出力</span>
          <select id="headphone-output"></select>
        </label>
        <label class="field">
          <span>仮想マイク出力（BlackHole 2ch）</span>
          <select id="virtual-output"></select>
        </label>
      </section>

      <section class="panel">
        <h2 style="margin: 0; font-size: 15px">3. 認証とBroker</h2>
        <label class="field">
          <span>Cloudflare Worker URL</span>
          <input id="broker-url" type="url" placeholder="https://xxxx.workers.dev" />
        </label>
        <label class="field">
          <span>接続コード（Bearer・sessionのみ保存）</span>
          <input id="pairing-token" type="password" autocomplete="off" placeholder="再入力が必要な場合のみ" />
        </label>
        <div class="hint" id="pairing-status"></div>
        <div class="grid-2">
          <button id="btn-save" class="primary">設定を保存</button>
          <button id="btn-clear-pairing" class="danger">接続コードを消去</button>
        </div>
      </section>

      <section class="panel">
        <h2 style="margin: 0; font-size: 15px">4. Meet側の確認</h2>
        <ol class="hint">
          <li>BlackHole 2ch をインストールし、Chromeを再起動</li>
          <li>Meetのマイクを BlackHole 2ch、スピーカーをイヤホンに設定</li>
          <li>日本語原音が相手に届かないことをテスト会議で確認</li>
          <li>拡張の開始後、受信を確認してから送信を有効化</li>
        </ol>
        <p id="status" class="hint"></p>
      </section>
    </div>
    <script type="module" src="setup.js"></script>
  </body>
</html>
