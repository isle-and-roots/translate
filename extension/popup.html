<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet Interpreter</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body class="popup" data-meeting-state="IDLE">
    <div class="wrap">
      <header class="app-header">
        <h1>Meet Interpreter</h1>
        <p>Google Meet / Zoom をワンクリックで英日双方向通訳</p>
      </header>

      <section class="panel">
        <div class="row">
          <span class="muted">状態</span>
          <span class="status-pill" data-meeting-label>—</span>
        </div>
        <div class="row">
          <span class="muted">会議アプリ</span>
          <span data-platform>—</span>
        </div>
        <div class="row">
          <span class="muted">受信 (EN→JA)</span>
          <strong data-rx-state>OFF</strong>
        </div>
        <div class="row">
          <span class="muted">送信 (JA→EN)</span>
          <strong data-tx-state>OFF</strong>
        </div>
        <div class="row">
          <span class="muted">経過</span>
          <span data-elapsed>0:00</span>
        </div>
        <div class="row">
          <span class="muted">概算費用</span>
          <span data-cost>$0.00（概算）</span>
        </div>
        <p class="hint" data-message></p>
        <p class="error" data-error></p>
      </section>

      <section class="panel">
        <label class="field">
          <span>接続先</span>
          <select id="source-mode">
            <option value="tab">前面タブ（Google Meet / Zoom ブラウザ版）</option>
            <option value="device">Zoom デスクトップアプリ（仮想デバイス）</option>
          </select>
        </label>
        <p class="hint" id="source-hint"></p>
      </section>

      <section class="actions">
        <button id="btn-start" class="primary">開始（双方向）</button>
        <button id="btn-stop" class="danger">すべて停止</button>
        <button id="btn-listen">原音を聞く</button>
        <button id="btn-renew" hidden>セッション更新</button>
        <button id="btn-tx" class="secondary">送信だけ停止（緊急）</button>
      </section>

      <section class="panel">
        <label class="field">
          <span>原音 <strong id="gain-original-value">20%</strong></span>
          <input id="gain-original" type="range" min="0" max="100" value="20" />
        </label>
        <label class="field">
          <span>日本語訳 <strong id="gain-translation-value">100%</strong></span>
          <input id="gain-translation" type="range" min="0" max="100" value="100" />
        </label>
      </section>

      <section class="panel">
        <div class="row"><span class="muted">物理マイク</span><span id="device-mic">—</span></div>
        <div class="row"><span class="muted">イヤホン</span><span id="device-headphone">—</span></div>
        <div class="row"><span class="muted">BlackHole</span><span id="device-virtual">—</span></div>
        <div class="row" id="device-remote-row" hidden>
          <span class="muted">会議音声入力</span><span id="device-remote">—</span>
        </div>
        <div class="hint" id="pairing-status"></div>
        <div class="hint" id="broker-url"></div>
      </section>

      <section class="panel">
        <details>
          <summary>字幕（保存なし）</summary>
          <p class="muted">受信訳</p>
          <div class="transcript" id="rx-transcript">—</div>
          <p class="muted">送信訳</p>
          <div class="transcript" id="tx-transcript">—</div>
        </details>
      </section>

      <section class="grid-2">
        <button id="btn-setup">設定</button>
        <button id="btn-control">コントロール窓</button>
      </section>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
