name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build extension
        run: npm run build
        env:
          BROKER_BASE_URL: ${{ vars.BROKER_BASE_URL || 'https://YOUR-BROKER.workers.dev' }}
      - name: Build worker (dry run)
        run: npm run build:worker
        env:
          WRANGLER_SEND_METRICS: "false"
      # Distribution zip only when the production broker URL is configured
      # as a repository variable (Settings > Variables > BROKER_BASE_URL).
      - name: Package extension
        if: vars.BROKER_BASE_URL != ''
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: vars.BROKER_BASE_URL != ''
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error
